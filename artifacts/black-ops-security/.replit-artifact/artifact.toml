kind = "web"
previewPath = "/"
title = "Black Ops Security Group"
version = "1.0.0"
id = "artifacts/black-ops-security"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21560

[services.development]
run = "pnpm --filter @workspace/black-ops-security run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/black-ops-security", "run", "build" ]
publicDir = "artifacts/black-ops-security/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21560"
BASE_PATH = "/"
